# REIP — обратный прокси перед контейнером app (127.0.0.1:8000).
#
# Единственный конфиг проекта. Раньше их было два: этот, живший на сервере, и
# nginx/nginx.conf, продуманный, но никуда не установленный. Разошлись они в
# важном: на сервере не было client_max_body_size, а значит действовал
# умолчательный 1 МБ, и загрузка каталога недвижимости падала с 413 задолго до
# того, как файл доходил до приложения.
#
# Сроки ожидания разные по назначению: вебхукам Telegram нужен быстрый ответ,
# запросам к ИИ — долгий (ТЗ раздел 25 требует 120s).

server {
    listen 80;
    listen [::]:80;
    server_name reip.grouvi.online;

    # Оставлено открытым по HTTP: сюда ходит Let's Encrypt при продлении.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reip.grouvi.online;

    ssl_certificate /etc/letsencrypt/live/reip.grouvi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reip.grouvi.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        # Импорт каталога: XLSX на несколько тысяч объектов. Приложение своего
        # предела не ставит, так что этот — единственный.
        client_max_body_size 25m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
}
