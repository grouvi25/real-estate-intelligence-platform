# nginx site for reip.grouvi.online — copy of what runs in production.
#
# This file existed only on the server. Everything else about the deployment is
# reproducible from this repository, so a rebuilt box would have come back with
# no TLS, no HTTP→HTTPS redirect and nothing proxied to the app, and the only
# record of how it had been set up would have been gone with the machine.
#
# Install:
#   cp deploy/nginx/reip.grouvi.online.conf /etc/nginx/conf.d/
#   certbot --nginx -d reip.grouvi.online     # fills in the certificate paths
#   nginx -t && systemctl reload nginx
#
# The box hosts several unrelated projects, so this file is additive and touches
# nothing outside its own server_name.

server {
    server_name reip.grouvi.online;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/reip.grouvi.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reip.grouvi.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = reip.grouvi.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name reip.grouvi.online;
    return 404; # managed by Certbot
}
