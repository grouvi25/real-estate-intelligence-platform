<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Real Estate Intelligence</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Мост MAX: без него window.WebApp не появляется, приложение считает себя
       обычным браузером и не получает подпись запуска. Оба моста грузятся
       всегда — лишний не мешает, а платформа определяется по тому, какой ожил. -->
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <link rel="stylesheet" href="css/styles.css?v=47" />
</head>
<body>
  <main id="view"><p class="muted" style="padding:24px">Загрузка…</p></main>

  <!-- Core -->
  <!-- Chart.js, vendored rather than pulled from a CDN: the app runs inside
       Telegram and must not depend on somebody else's server being up. -->
  <script src="js/vendor/chart.umd.min.js?v=47"></script>
  <script src="platform_init.js?v=47"></script>
  <script src="js/icons.js?v=47"></script>
  <script src="js/api_client.js?v=47"></script>
  <script src="js/components.js?v=47"></script>
  <script src="js/charts.js?v=47"></script>
  <script src="js/maps.js?v=47"></script>
  <script src="js/router.js?v=47"></script>
  <script src="js/auth.js?v=47"></script>
  <!-- Screens -->

  <script src="js/screens/signals.js?v=47"></script>
  <script src="js/screens/signal_queue.js?v=47"></script>
  <script src="js/screens/leads.js?v=47"></script>
  <script src="js/screens/properties.js?v=47"></script>

  <script src="js/screens/tasks.js?v=47"></script>
  <script src="js/screens/sources.js?v=47"></script>
  <script src="js/screens/admin.js?v=47"></script>
  <!-- Bootstrap -->
  <script src="js/app.js?v=47"></script>
</body>
</html>
