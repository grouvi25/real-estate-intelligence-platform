[project]
name = "real-estate-intelligence-platform"
version = "2.0.0"
description = "REIP - AI real estate buyer intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.3",
    "gevent>=24.2",
    "httpx>=0.26",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "aiogram>=3.3",
    "telethon>=1.34",
    "python-multipart>=0.0.9",
    # Agency catalogues arrive as Excel; CSV alone would not cover the
    # common case (app/services/property_import.py).
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "httpx>=0.26",
    "fakeredis>=2.20",
    "ruff>=0.2",
    "mypy>=1.8",
]
# PDF rendering needs system libs (Pango/Cairo); kept optional so the base image
# and CI stay lean. Enable with: pip install -e .[pdf]
pdf = [
    "weasyprint>=61.0",
]
# Object storage (Yandex Object Storage, S3-compatible). Optional: dev/CI use the
# LocalStorage fallback. Enable with: pip install -e .[storage]
storage = [
    "boto3>=1.34",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly rather than inherited. Through ruff 0.15 the project ran on
# ruff's defaults (E4/E7/E9/F); 0.16 widened those defaults, so an unpinned
# linter upgrade turned CI red on 451 pre-existing findings in untouched files —
# including B008 on FastAPI's `Depends()`, which is the intended pattern. Pinning
# the set keeps lint reproducible across ruff versions.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
