name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reip_test
      REDIS_URL: redis://localhost:6379/0
      RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check Mini App JS
        run: |
          for f in $(find mini_app -name '*.js'); do echo "check $f"; node --check "$f"; done

  deploy:
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: reip-vps-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Prepare VPS (Docker + .env)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            mkdir -p /opt/reip
            if [ ! -f /opt/reip/.env ]; then
              ENC=$(openssl rand -base64 32 | tr '+/' '-_')
              SEC=$(openssl rand -hex 32)
              PGP=$(openssl rand -hex 24)
              cat > /opt/reip/.env <<EOF
            POSTGRES_PASSWORD=${PGP}
            DATABASE_URL=postgresql+asyncpg://re_app:${PGP}@db:5432/realestate
            REDIS_URL=redis://redis:6379/0
            ENCRYPTION_KEY=${ENC}
            SECRET_KEY=${SEC}
            NODE_ENV=production
            BASE_URL=https://reip.grouvi.online
            YC_SERVICE_ACCOUNT_KEY_FILE=/app/secrets/sa-key.json
            YC_FOLDER_ID=dev
            YC_S3_BUCKET=dev
            YC_S3_ACCESS_KEY=dev
            YC_S3_SECRET_KEY=dev
            TELEGRAM_BOT_TOKEN=dev
            TELEGRAM_BOT_USERNAME=dev_bot
            EOF
            fi

      - name: Copy code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "."
          target: "/opt/reip"
          overwrite: true

      - name: Deploy (docker compose up)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/reip
            # Remove leftover temp-renamed app containers from an interrupted/concurrent deploy.
            docker ps -a --filter "name=reip-app-1" --format '{{.ID}} {{.Names}}' | awk '$2 != "reip-app-1" {print $1}' | xargs -r docker rm -f || true
            docker compose up -d --build
            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                echo "OK: /health responded"
                break
              fi
              sleep 3
            done
            docker compose ps
            curl -fsS http://localhost:8000/health || (docker compose logs app --tail 60; exit 1)
