version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: re_app
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: realestate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U re_app -d realestate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A worker.celery_app worker -l info -c 4 --pool=gevent
    env_file: .env
    depends_on:
      - app
    restart: unless-stopped

  beat:
    build: .
    command: celery -A worker.celery_app beat -l info
    env_file: .env
    depends_on:
      - worker
    restart: unless-stopped

volumes:
  pgdata:
